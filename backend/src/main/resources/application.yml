spring:
  application:
    name: mindcare-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mindcare}
    username: ${DB_USERNAME:mindcare}
    password: ${DB_PASSWORD:mindcare}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

mindcare:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://mohamed-hamdy.github.io}
  jwt:
    # In production, override MINDCARE_JWT_SECRET with a long random value (32+ bytes).
    # This default is only for local/demo use via docker-compose.
    secret: ${JWT_SECRET:mindcare-demo-only-jwt-secret-key-change-me-32bytes-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

logging:
  level:
    com.mindcare.backend: INFO
